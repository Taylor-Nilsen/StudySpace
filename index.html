<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>UCLA StudySpace</title>
    <style>
        :root{--accent:#60a5fa;--muted:#94a3b8;--bg:#0f172a}
        *{box-sizing:border-box}
        body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;background:var(--bg);margin:0;color:#e5e7eb}
        label{color:#e5e7eb}
        a{color:#93c5fd}
        a:hover{color:#bfdbfe}
        /* keep small equal side padding (matches header top padding) and constrain width */
        .container{width:100%;margin:0;padding:0;background:transparent;overflow:hidden}
        header{padding:20px 24px;border-bottom:none;background:#0f172a}
        header h1{margin:0;font-size:1.2rem;color:#f8fafc}
        header p{margin:6px 0 0;color:var(--muted);font-size:0.95rem}
        /* Single-column layout: filters on top, results below */
        main{display:block;gap:0;padding:8px 0}
        .controls{border-right:none;padding-right:0;margin-bottom:12px}
        .results-wrap{padding-left:0}
        @media (max-width:1200px){ main{display:block} .controls{border-right:none;padding-right:0} .results-wrap{padding-left:0} }
        /* make the top search row full width */
        .search-row{margin:0;padding:0 20px;display:flex;gap:8px;align-items:center}
        @media (max-width:880px){ .search-row{margin:0;padding:0 12px;flex-direction:column;align-items:stretch} .search-row select{width:100%} }
        .search-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .search-row input{flex:1 1 320px;min-width:120px}
        .search-row select{flex:1 1 200px;min-width:120px}
        input,select{padding:8px;border:1px solid #1f2937;border-radius:6px;background:#1f2937;color:#e5e7eb}
        .custom-multiselect{position:relative;display:inline-block;width:100%}
        .multiselect-display{padding:8px;border:1px solid #1f2937;border-radius:6px;background:#1f2937;color:#e5e7eb;cursor:pointer;user-select:none}
        .multiselect-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#1e3a5f;border:1px solid #1f2937;border-radius:6px;z-index:1000;margin-top:4px;max-height:300px;overflow-y:auto}
        .multiselect-dropdown.open{display:block}
        .multiselect-dropdown label{display:flex;align-items:center;padding:8px 12px;cursor:pointer;color:#e5e7eb}
        .multiselect-dropdown label:hover{background:rgba(96,165,250,0.15)}
        .multiselect-dropdown input[type="checkbox"]{margin-right:8px;cursor:pointer}
        .filters-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .selectors-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;color:#e5e7eb}
        .filter-group{display:flex;flex-direction:column;gap:6px;color:#e5e7eb}
        .filter-group.wide{grid-column:1 / -1}
        .day-time-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:12px}
        .characteristics-row{margin-top:12px}
        /* Characteristics: groups distributed into balanced vertical columns */
        .checkbox-group{display:block;max-height:320px;overflow:auto;padding:12px;border:1px solid #1f2937;border-radius:10px;background:#1f2937}
        .checkbox-group::-webkit-scrollbar{height:8px;width:8px}
        .checkbox-group::-webkit-scrollbar-thumb{background:rgba(96,165,250,0.2);border-radius:8px}
        .char-columns{display:flex;gap:16px;align-items:flex-start}
        .char-column{flex:1 1 240px;min-width:200px;max-width:360px;display:flex;flex-direction:column;gap:8px}
        .char-group{background:transparent;border:1px solid #1f2937;padding:6px;border-radius:6px;margin:0}
        .char-group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:600;color:#e5e7eb;font-size:0.95rem}
        .char-group-list{display:flex;flex-direction:column;gap:4px}
        .checkbox-item{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:4px;transition:background .12s ease}
        .checkbox-item:hover{background:rgba(96,165,250,0.1)}
        .checkbox-item input{width:auto;height:auto;margin:0;accent-color:var(--accent)}
        .checkbox-item label{font-size:0.92rem;color:#e5e7eb;line-height:1.1}
        @media (max-width:1000px){ .char-columns{gap:12px} }
        @media (max-width:700px){ .char-columns{flex-direction:column} .char-column{max-width:none;min-width:0} }

        .controls-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
        /* Make the full-filters section span the full width above the columns */
        .full-filters{flex-basis:100%;width:100%;padding:12px 20px;border-bottom:none;background:transparent}
        /* Ensure on narrow screens selectors stack and characteristics remain full width */
        @media (max-width:880px){ .selectors-grid{grid-template-columns:1fr} .day-time-row{flex-direction:column;align-items:stretch} .checkbox-group{max-height:160px} }
        .day-filter{display:flex;gap:6px}
        .day-btn{padding:6px 8px;border-radius:6px;border:1px solid #1f2937;background:#1f2937;cursor:pointer;color:#e5e7eb}
        .day-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .time-picker{display:flex;gap:6px;align-items:center}

        .checkbox-item{display:flex;align-items:center;gap:6px}
        .controls-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
        /* Center column: slightly larger cards to better occupy center space */
        .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:0 20px}
        .room-card{background:#1f2937;border:1px solid #1f2937;padding:12px;border-radius:12px;transition:transform .12s ease,box-shadow .12s ease}
        .room-card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,0,0,0.3);border-color:rgba(96,165,250,0.2)}
        /* Use a consistent 4:3 aspect ratio for room images */
        .room-image{width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:8px;margin-bottom:10px;max-height:360px;min-height:120px;background:#1f2937}
        .room-image img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;opacity:1;transition:opacity 0.3s}
        .room-image img.loading{opacity:0.5}
        .room-card.no-image .room-image{display:none}
        /* Cards without images: vertically center main content */
        .room-card{display:flex;flex-direction:column}
        .room-card.no-image .room-body{display:flex;flex-direction:column;justify-content:center;min-height:180px}

        /* Results grid: max 3 columns */
        .results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 20px}
        @media (max-width:1000px){ .results{grid-template-columns:repeat(2,1fr)} }
        @media (max-width:640px){ .results{grid-template-columns:repeat(1,1fr)} }
        /* Button styles */
        .btn{background:#1f2937;border:1px solid #1f2937;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:#e5e7eb;transition:all .12s ease;box-shadow:0 1px 0 rgba(0,0,0,0.1)}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(96,165,250,0.1);border-color:#60a5fa}
        .btn:focus{outline:3px solid rgba(96,165,250,0.2)}
        .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
        .btn-secondary{background:#1f2937;color:#e5e7eb;border-color:#1f2937}
        .btn-details{background:#3b82f6;color:#fff;border-color:#3b82f6;font-weight:600}

        /* Details panel styling */
        .details{display:none;margin-top:8px;padding:12px;border-radius:6px;background:#1f2937;border:none}
        .details.active{display:block}
        .room-title{font-weight:600;margin:0 0 6px;color:#f8fafc}
        .room-info{display:flex;gap:8px;align-items:center;font-size:0.9rem;color:var(--muted)}
        .badge{padding:4px 8px;border-radius:6px;font-size:0.8rem;background:#1f2937;border:1px solid #1f2937;color:#e5e7eb}
        .char-tag{display:inline-block;background:#1e3a5f;color:var(--accent);padding:4px 6px;border-radius:6px;margin:4px 6px 0 0;font-size:0.78rem;border:1px solid rgba(96,165,250,0.2)}
        .details .day-name{font-weight:600;color:var(--accent);margin-bottom:6px}
        .details .free-times{background:#1f2937;border-radius:6px;padding:6px;margin-top:6px;border:none;color:var(--muted)}
        .time-slot{font-size:0.85rem;padding:6px;border-radius:6px;background:#1f2937;border:none;margin-top:6px;color:#e5e7eb}
        .schedule-calendar{display:flex;flex-direction:column;gap:0;border:none;border-radius:8px;overflow:hidden;margin-top:12px;background:#1e3a5f;min-height:350px}
        .calendar-header-row{display:flex;gap:0}
        .calendar-header-time{width:45px;border-right:none;background:#1e3a5f}
        .calendar-header-day{flex:1;border-right:none;background:#1e3a5f;padding:4px;font-weight:600;color:#e5e7eb;text-align:center;font-size:0.7rem;display:flex;align-items:center;justify-content:center}
        .calendar-header-day:last-child{border-right:none}
        .calendar-body{display:flex;gap:0;flex:1}
        .calendar-time-col{width:45px;border-right:none;background:#1e3a5f;display:flex;flex-direction:column;position:relative;z-index:10}
        .calendar-time-label{flex:1;font-size:0.65rem;font-weight:500;color:#cbd5e1;text-align:center;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(96,165,250,0.15);line-height:1}
        .calendar-time-label:last-child{border-bottom:none}
        .calendar-column{flex:1;display:flex;flex-direction:column;border-right:none;position:relative}
        .calendar-column:last-child{border-right:none}
        .calendar-day-events{flex:1;position:relative;background:#1e3a5f}
        .calendar-day-events::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background-image:linear-gradient(180deg, transparent calc(6.25% - 1px), rgba(30,41,58,0.3) calc(6.25% - 1px), rgba(30,41,58,0.3) calc(6.25%), transparent calc(6.25%)),linear-gradient(180deg, transparent calc(12.5% - 1px), rgba(30,41,58,0.3) calc(12.5% - 1px), rgba(30,41,58,0.3) calc(12.5%), transparent calc(12.5%)),linear-gradient(180deg, transparent calc(18.75% - 1px), rgba(30,41,58,0.3) calc(18.75% - 1px), rgba(30,41,58,0.3) calc(18.75%), transparent calc(18.75%)),linear-gradient(180deg, transparent calc(25% - 1px), rgba(30,41,58,0.3) calc(25% - 1px), rgba(30,41,58,0.3) calc(25%), transparent calc(25%)),linear-gradient(180deg, transparent calc(31.25% - 1px), rgba(30,41,58,0.3) calc(31.25% - 1px), rgba(30,41,58,0.3) calc(31.25%), transparent calc(31.25%)),linear-gradient(180deg, transparent calc(37.5% - 1px), rgba(30,41,58,0.3) calc(37.5% - 1px), rgba(30,41,58,0.3) calc(37.5%), transparent calc(37.5%)),linear-gradient(180deg, transparent calc(43.75% - 1px), rgba(30,41,58,0.3) calc(43.75% - 1px), rgba(30,41,58,0.3) calc(43.75%), transparent calc(43.75%)),linear-gradient(180deg, transparent calc(50% - 1px), rgba(30,41,58,0.3) calc(50% - 1px), rgba(30,41,58,0.3) calc(50%), transparent calc(50%)),linear-gradient(180deg, transparent calc(56.25% - 1px), rgba(30,41,58,0.3) calc(56.25% - 1px), rgba(30,41,58,0.3) calc(56.25%), transparent calc(56.25%)),linear-gradient(180deg, transparent calc(62.5% - 1px), rgba(30,41,58,0.3) calc(62.5% - 1px), rgba(30,41,58,0.3) calc(62.5%), transparent calc(62.5%)),linear-gradient(180deg, transparent calc(68.75% - 1px), rgba(30,41,58,0.3) calc(68.75% - 1px), rgba(30,41,58,0.3) calc(68.75%), transparent calc(68.75%)),linear-gradient(180deg, transparent calc(75% - 1px), rgba(30,41,58,0.3) calc(75% - 1px), rgba(30,41,58,0.3) calc(75%), transparent calc(75%)),linear-gradient(180deg, transparent calc(81.25% - 1px), rgba(30,41,58,0.3) calc(81.25% - 1px), rgba(30,41,58,0.3) calc(81.25%), transparent calc(81.25%)),linear-gradient(180deg, transparent calc(87.5% - 1px), rgba(30,41,58,0.3) calc(87.5% - 1px), rgba(30,41,58,0.3) calc(87.5%), transparent calc(87.5%)),linear-gradient(180deg, transparent calc(93.75% - 1px), rgba(30,41,58,0.3) calc(93.75% - 1px), rgba(30,41,58,0.3) calc(93.75%), transparent calc(93.75%))}
        .calendar-event{position:absolute;left:1px;right:1px;background:#60a5fa;border-radius:4px;overflow:hidden;z-index:2}
        .no-results{padding:28px;text-align:center;color:var(--muted)}
        footer.site-footer{padding:10px;background:transparent;border-top:none;text-align:center;color:var(--muted);font-size:0.85rem}
        @media (max-width:880px){main{flex-direction:column} .controls{flex:unset;border-right:none;padding-right:0}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 UCLA StudySpace</h1>
        </header>



        <main>
            <!-- Full-width filters area: selectors on top, options (characteristics) underneath -->
            <section class="full-filters" aria-label="Filters">
                <div class="selectors-grid">
                    <div class="filter-group">
                        <label for="buildingFilter">🏢 Building</label>
                        <div class="custom-multiselect" id="buildingFilterWrapper">
                            <div class="multiselect-display" id="buildingDisplay">All Buildings</div>
                            <div class="multiselect-dropdown" id="buildingDropdown"></div>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="capacityFilter">👥 Minimum Capacity</label>
                        <input type="number" id="capacityFilter" min="0" placeholder="e.g., 30">
                    </div>
                    <div class="filter-group">
                        <label for="maxCapacityFilter">👥 Maximum Capacity</label>
                        <input type="number" id="maxCapacityFilter" min="0" placeholder="e.g., 100">
                    </div>
                    <div class="filter-group">
                        <label for="roomSearch">🔍 Search Room</label>
                        <input type="text" id="roomSearch" placeholder="e.g., BOELTER 2444">
                    </div>
                    <div class="filter-group">
                        <label for="sortBy">Sort</label>
                        <select id="sortBy"><option value="available">Available Now</option><option value="capacity_desc">Capacity ↓</option><option value="capacity_asc">Capacity ↑</option><option value="building">Building</option></select>
                    </div>
                </div>

                <div class="day-time-row">
                    <div class="filter-group" style="flex:1">
                        <label>📅 Day of Week</label>
                        <div class="day-filter">
                            <button class="day-btn" data-day="Sunday">Sun</button>
                            <button class="day-btn" data-day="Monday">Mon</button>
                            <button class="day-btn" data-day="Tuesday">Tue</button>
                            <button class="day-btn" data-day="Wednesday">Wed</button>
                            <button class="day-btn" data-day="Thursday">Thu</button>
                            <button class="day-btn" data-day="Friday">Fri</button>
                            <button class="day-btn" data-day="Saturday">Sat</button>
                        </div>
                    </div>

                    <div class="filter-group" style="flex:1">
                        <label>🕐 Show rooms free between:</label>
                        <div class="time-picker">
                            <select id="startTime"><option value="">Any time</option></select>
                            <span>to</span>
                            <select id="endTime"><option value="">Any time</option></select>
                        </div>
                    </div>
                </div>

                <div class="characteristics-row">
                    <label>✨ Characteristics</label>
                    <div style="margin:8px 0">
                        <button class="btn btn-secondary" type="button" onclick="selectAllCharacteristics()">Select all</button>
                        <button class="btn btn-secondary" type="button" onclick="clearCharacteristics()" style="margin-left:8px">Clear</button>
                    </div>
                    <div class="checkbox-group" id="characteristicsFilter"></div>
                </div>

                <div class="controls-actions">
                    <div style="display:flex;gap:8px;align-items:center">
                        <button class="btn btn-secondary" onclick="clearFilters()">Clear All Filters</button>
                    </div>
                    <div class="stats"><strong id="totalRooms">0</strong> rooms found • <strong id="availableRooms">0</strong> currently available</div>
                </div>
            </section>

            <section class="results-wrap">
                <div id="results" class="results" aria-live="polite"></div>
            </section>
        </main>



    </div>

    <script id="embeddedSample" type="application/json">[
        {"text":"BOELTER 2444","building":"BOELTER","room":"02444","offered":true,"capacity":80,"type":"Classroom","url":"https://sa.ucla.edu/ro/Public/SOC/Results/ClassroomDetail?term=26W&classroom=BOELTER+%7C++02444++","characteristics":["Air Conditioning","Projection Screen"],"schedule":{"Monday":[{"course":"EC ENGR 133A","type":"LEC","start_time":"02:00 PM","end_time":"03:50 PM","enrolled":80,"capacity":80}],"Tuesday":[],"Wednesday":[],"Thursday":[],"Friday":[]}}
    ]</script>

    <script>
    // Compact, clear app logic
    let classroomsData=[], allCharacteristics=new Set(), selectedDay='', selectedCharacteristics=new Set(), selectedBuildings=new Set(), dataLoaded=false;
    const defaultCharacteristics = ['Air Conditioning','Chalkboard','Projection Screen','Video Projector-Installed','Microphone-Installed'];
    const timeSlots=['07:00 AM','08:00 AM','09:00 AM','10:00 AM','11:00 AM','12:00 PM','01:00 PM','02:00 PM','03:00 PM','04:00 PM','05:00 PM','06:00 PM','07:00 PM','08:00 PM','09:00 PM','10:00 PM'];

    // Categories used to group similar characteristics together (ordered)
    const CHARACTERISTIC_CATEGORIES = [
        {name:'Room Features', patterns:[/air conditioning/i,/window/i,/windows/i,/chalkboard/i,/whiteboard/i,/white board/i,/windows/i]},
        {name:'Audio / AV', patterns:[/projector/i,/audio/i,/video/i,/microphone/i,/projection screen/i,/overhead projector/i,/comp projector/i,/media equipment/i,/vhs/i,/monitor/i,/wireless microphone/i]},
        {name:'Seating & Layout', patterns:[/auditorium/i,/fixed tables/i,/fixed tablet/i,/tablet arm/i,/fixed tablet arm/i,/fixed arm/i,/seating/i]},
        {name:'Connectivity', patterns:[/gacnet/i,/backbone/i,/hookup/i,/network/i,/ethernet/i,/wireless/i]},
        {name:'Other', patterns:[]}
    ];

    function categorizeCharacteristics(chars){
        const groups = new Map();
        for(const c of [...chars].sort()){
            let placed=false;
            for(const cat of CHARACTERISTIC_CATEGORIES){
                if(cat.patterns.some(p=>p.test(c))){
                    if(!groups.has(cat.name)) groups.set(cat.name,[]);
                    groups.get(cat.name).push(c);
                    placed=true; break;
                }
            }
            if(!placed){ if(!groups.has('Other')) groups.set('Other',[]); groups.get('Other').push(c); }
        }
        // keep defined order
        const ordered=[];
        for(const cat of CHARACTERISTIC_CATEGORIES) if(groups.has(cat.name)) ordered.push([cat.name, groups.get(cat.name)]);
        // ensure 'Other' appears at end
        if(groups.has('Other') && !ordered.some(([n])=>n==='Other')) ordered.push(['Other', groups.get('Other')]);
        return ordered;
    }

    function renderCharacteristicCheckboxes(chars, preserveChecked=true){
        const wrap = document.getElementById('characteristicsFilter');
        const prevChecked = preserveChecked ? new Set([...wrap.querySelectorAll('input[type="checkbox"]:checked')].map(cb=>cb.value)) : new Set();
        wrap.innerHTML = '';

        const groups = categorizeCharacteristics(chars);

        // Determine number of columns based on the container width (preferred column width ~260px)
        const containerWidth = wrap.clientWidth || wrap.offsetWidth || window.innerWidth;
        const preferredCol = 260;
        let nCols = Math.max(1, Math.min(3, Math.floor(containerWidth / preferredCol)));
        nCols = Math.min(nCols, groups.length || 1);

        // Greedy distribution to balance item counts between columns (keep sections intact)
        const columns = Array.from({length: nCols}, ()=>[]);
        const sizes = new Array(nCols).fill(0);
        groups.forEach(([name, list]) => {
            const size = list.length + 1; // header + items
            let minIdx = 0; for(let i=1;i<nCols;i++) if(sizes[i] < sizes[minIdx]) minIdx = i;
            columns[minIdx].push([name, list]);
            sizes[minIdx] += size;
        });

        // Build column elements
        const colsWrap = document.createElement('div'); colsWrap.className = 'char-columns';
        columns.forEach(col => {
            const colEl = document.createElement('div'); colEl.className = 'char-column';
            col.forEach(([name, list])=>{
                const group = document.createElement('div'); group.className='char-group'; group.setAttribute('data-group', name);
                const header = document.createElement('div'); header.className='char-group-header';
                const title = document.createElement('div'); title.textContent = name;
                const ctrls = document.createElement('div'); ctrls.className='char-group-controls';
                const sel = document.createElement('button'); sel.className='btn btn-secondary'; sel.type='button'; sel.textContent='Select'; sel.addEventListener('click', ()=>{ group.querySelectorAll('input[type="checkbox"]').forEach(cb=>{ cb.checked=true; selectedCharacteristics.add(cb.value); }); handleFilterChange(); });
                const clr = document.createElement('button'); clr.className='btn btn-secondary'; clr.type='button'; clr.textContent='Clear'; clr.style.marginLeft='8px'; clr.addEventListener('click', ()=>{ group.querySelectorAll('input[type="checkbox"]').forEach(cb=>{ cb.checked=false; selectedCharacteristics.delete(cb.value); }); handleFilterChange(); });
                ctrls.appendChild(sel); ctrls.appendChild(clr);
                header.appendChild(title); header.appendChild(ctrls);
                group.appendChild(header);

                const listEl = document.createElement('div'); listEl.className='char-group-list';
                list.forEach(c=>{
                    const id='c-'+c.replace(/\s+/g,'-');
                    const div=document.createElement('div'); div.className='checkbox-item';
                    div.innerHTML = `<input type="checkbox" id="${id}" value="${c}" ${prevChecked.has(c)?'checked':''}><label for="${id}">${c}</label>`;
                    listEl.appendChild(div);
                });
                group.appendChild(listEl);
                colEl.appendChild(group);
            });
            colsWrap.appendChild(colEl);
        });

        wrap.appendChild(colsWrap);

        // update selectedCharacteristics and bind events
        selectedCharacteristics.clear();
        wrap.querySelectorAll('input[type="checkbox"]:checked').forEach(cb=>selectedCharacteristics.add(cb.value));
        wrap.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.addEventListener('change', function(){ if(this.checked) selectedCharacteristics.add(this.value); else selectedCharacteristics.delete(this.value); handleFilterChange(); }));

        // Stable resize handler that rebalances columns
        if(!window._charResizeBound){
            window._charResizeBound = () => { if(window._charResizeTimer) clearTimeout(window._charResizeTimer); window._charResizeTimer = setTimeout(()=>{ renderCharacteristicCheckboxes(allCharacteristics, true); }, 200); };
            window.addEventListener('resize', window._charResizeBound);
        }
    }



    document.addEventListener('DOMContentLoaded', ()=>{
        const s=document.getElementById('startTime'), e=document.getElementById('endTime'); timeSlots.forEach(t=>{ s.innerHTML+=`<option value="${t}">${t}</option>`; e.innerHTML+=`<option value="${t}">${t}</option>`});
        ['change','input'].forEach(ev=>{ document.getElementById('capacityFilter').addEventListener(ev,handleFilterChange); document.getElementById('maxCapacityFilter').addEventListener(ev,handleFilterChange); document.getElementById('startTime').addEventListener('change',handleFilterChange); document.getElementById('endTime').addEventListener('change',handleFilterChange); document.getElementById('sortBy').addEventListener('change',handleFilterChange); });
        
        // Building multi-select dropdown toggle
        const buildingDisplay = document.getElementById('buildingDisplay');
        const buildingDropdown = document.getElementById('buildingDropdown');
        buildingDisplay.addEventListener('click', function(e){ e.stopPropagation(); buildingDropdown.classList.toggle('open'); });
        buildingDropdown.addEventListener('click', function(e){ e.stopPropagation(); });
        document.addEventListener('click', function(){ buildingDropdown.classList.remove('open'); });
        
        document.getElementById('roomSearch').addEventListener('input', debounce(handleFilterChange,200));
        document.querySelectorAll('.day-btn').forEach(b=>b.addEventListener('click', ()=>{ document.querySelectorAll('.day-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selectedDay=b.dataset.day; handleFilterChange(); }));

        // close any open details when clearing filters or loading data
        window.toggleDetails = function(button){ const details = button.closest('.room-card').querySelector('.details'); if(!details) return; details.classList.toggle('active'); button.textContent = details.classList.contains('active') ? 'Details ▴' : 'Details ▾'; };

        // Card click handler - toggle details on click anywhere except buttons and links
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.room-card');
            if (!card) return;
            
            // Don't toggle if clicking on button, link, or their children
            if (e.target.closest('button') || e.target.closest('a')) return;
            
            const details = card.querySelector('.details');
            const button = card.querySelector('button');
            if (!details || !button) return;
            
            details.classList.toggle('active');
            button.textContent = details.classList.contains('active') ? 'Details ▴' : 'Details ▾';
        });

        // render default characteristics immediately so checkboxes are visible even before data loads
        renderCharacteristicCheckboxes(defaultCharacteristics, false);



        setDefaultTimesAndDay(); loadData();
    });

    function getTermLabel(termCode){
        if(!termCode) return '';
        const match=termCode.match(/(\d{2})([WSUF])/);
        if(!match) return '';
        const [, year, quarter]=match;
        const fullYear='20'+year;
        const quarters={'W':'Winter','S':'Spring','U':'Summer','F':'Fall'};
        return (quarters[quarter]||'')+' '+fullYear;
    }
    function extractTermCode(url){
        if(!url) return '';
        const match=url.match(/term=(\d{2}[WSUF])/);
        return match?match[1]:'';
    }
    function loadData(){ const r=document.getElementById('results'); r.innerHTML='<div class="loading">Loading…</div>'; fetch('classrooms.json').then(res=>{ if(!res.ok) throw new Error('not found'); return res.json() }).then(d=>useData(d)).catch(err=>{ console.warn('fetch failed',err); const embedded=document.getElementById('embeddedSample'); if(embedded){ try{ return useData(JSON.parse(embedded.textContent)); }catch(e){console.error('embedded parse',e);} } fetch('data/sample.json').then(res=>res.json()).then(d=>useData(d)).catch(e=>{ console.error('no data',e); classroomsData=[]; dataLoaded=true; initializeFilters(); renderResults(); r.innerHTML='<div class="no-results"><h2>No data</h2><p>Add classrooms.json or run via server to use the full dataset.</p></div>';}); }); }
    function useData(raw){ classroomsData=raw.filter(r=>r.offered!==false); if(classroomsData.length>0&&classroomsData[0].url){ const term=extractTermCode(classroomsData[0].url); const label=getTermLabel(term); if(label) document.title='UCLA StudySpace '+label; } dataLoaded=true; initializeFilters(); renderResults(); }

    function initializeFilters(){
        // Start from defaults and merge any characteristics found in data
        allCharacteristics = new Set();
        defaultCharacteristics.forEach(c => allCharacteristics.add(c));
        classroomsData.forEach(r => r.characteristics && r.characteristics.forEach(c => allCharacteristics.add(c)));

        // Populate building multi-select
        const allBuildings = [...new Set(classroomsData.map(r => r.building).filter(Boolean))].sort();
        const dropdown = document.getElementById('buildingDropdown');
        dropdown.innerHTML = allBuildings.map(b => `<label><input type="checkbox" value="${b}"> ${b}</label>`).join('');
        dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', function() {
                if(this.checked) selectedBuildings.add(this.value);
                else selectedBuildings.delete(this.value);
                updateBuildingDisplay();
                handleFilterChange();
            });
        });

        // Render characteristics while preserving checked states
        renderCharacteristicCheckboxes(allCharacteristics, true);
    }

    function selectAllCharacteristics(){ document.querySelectorAll('#characteristicsFilter input[type="checkbox"]').forEach(cb=>{ cb.checked = true; selectedCharacteristics.add(cb.value); }); handleFilterChange(); }
    function clearCharacteristics(){ document.querySelectorAll('#characteristicsFilter input[type="checkbox"]').forEach(cb=>{ cb.checked = false; }); selectedCharacteristics.clear(); handleFilterChange(); }

    function clearFilters(){ document.getElementById('capacityFilter').value=''; document.getElementById('maxCapacityFilter').value=''; document.getElementById('roomSearch').value=''; document.getElementById('startTime').value=''; document.getElementById('endTime').value=''; document.getElementById('sortBy').value='available'; selectedDay=''; selectedCharacteristics.clear(); selectedBuildings.clear(); document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('#buildingDropdown input[type="checkbox"]').forEach(cb=>cb.checked=false); document.querySelectorAll('#characteristicsFilter input[type="checkbox"]').forEach(cb=>cb.checked=false); updateBuildingDisplay(); handleFilterChange(); }

    function timeToMinutes(timeStr){ const [time,period]=timeStr.split(' '); let [h,m]=time.split(':').map(Number); if(period==='PM'&&h!==12)h+=12; if(period==='AM'&&h===12)h=0; return h*60+m; }
    function isRoomFreeAtTime(room,day,startTime,endTime){ if(!startTime||!endTime) return true; if(!room.schedule||!room.schedule[day]) return true; const rs=timeToMinutes(startTime), re=timeToMinutes(endTime); for(const s of room.schedule[day]){ const ss=timeToMinutes(s.start_time), se=timeToMinutes(s.end_time); if(!(re<=ss || rs>=se)) return false; } return true; }

    function handleFilterChange(){ if(!dataLoaded) return; renderResults(); }

    function updateBuildingDisplay(){
        const display = document.getElementById('buildingDisplay');
        if(selectedBuildings.size === 0){
            display.textContent = 'All Buildings';
        } else if(selectedBuildings.size === 1){
            display.textContent = [...selectedBuildings][0];
        } else {
            display.textContent = selectedBuildings.size + ' selected';
        }
    }

    function calculateDayAvailability(room, day){
        const schedule=room.schedule&&room.schedule[day]?room.schedule[day]:[];
        const occupiedHours=new Set();
        schedule.forEach(s=>{
            const startMin=timeToMinutes(s.start_time);
            const endMin=timeToMinutes(s.end_time);
            const durationMin=endMin-startMin;
            const hoursNeeded=Math.ceil(durationMin/60);
            const startHour=Math.floor(startMin/60);
            for(let i=0;i<hoursNeeded;i++){
                const hour=startHour+i;
                if(hour>=8&&hour<18) occupiedHours.add(hour);
            }
        });
        const totalHours=10; // 8am to 6pm
        const percentOccupied=Math.round((occupiedHours.size/totalHours)*100);
        const percentAvailable=100-percentOccupied;
        return percentAvailable;
    }

    function buildCalendarGrid(room){
        const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        let html=`<div class="schedule-calendar">`;
        
        // Header row
        html+=`<div class="calendar-header-row">`;
        html+=`<div class="calendar-header-time"></div>`;
        days.forEach(d=>{ const pct=calculateDayAvailability(room,d); html+=`<div class="calendar-header-day"><div>${d.slice(0,3)}</div><div style="font-size:0.6rem;color:#94a3b8;margin-top:2px">${pct}%</div></div>`; });
        html+=`</div>`;
        
        // Body: time column + day columns
        html+=`<div class="calendar-body">`;
        
        // Time column
        html+=`<div class="calendar-time-col">`;
        for(let h=7;h<=22;h++){
            const period=h<12?'AM':'PM';
            const h12=h===0?12:(h>12?h-12:h);
            const timeStr=h12+' '+period;
            html+=`<div class="calendar-time-label">${timeStr}</div>`;
        }
        html+=`</div>`;
        
        // Day columns
        days.forEach(d=>{
            const schedule=room.schedule&&room.schedule[d] ? room.schedule[d] : [];
            html+=`<div class="calendar-column">`;
            html+=`<div class="calendar-day-events">`;
            
            // Render each event as absolutely positioned block
            schedule.forEach(event=>{
                const startMin=timeToMinutes(event.start_time);
                const endMin=timeToMinutes(event.end_time);
                const dayStart=7*60; // 7am in minutes
                const dayEnd=23*60; // 11pm in minutes
                const dayRange=dayEnd-dayStart; // 16 hours = 960 minutes
                
                // Only show events that overlap with 7am-11pm window
                if(endMin>dayStart && startMin<dayEnd){
                    const clampedStart=Math.max(startMin, dayStart);
                    const clampedEnd=Math.min(endMin, dayEnd);
                    const topPct=((clampedStart-dayStart)/dayRange)*100;
                    const heightPct=(((clampedEnd-clampedStart))/dayRange)*100;
                    html+=`<div class="calendar-event" style="top:${topPct}%;height:${heightPct}%"></div>`;
                }
            });
            
            html+=`</div></div>`;
        });
        
        html+=`</div></div>`;
        return html;
    }

    function getFreeTimes(room,day){ if(!room.schedule||!room.schedule[day]||room.schedule[day].length===0) return ['All day']; const schedule=room.schedule[day].slice().sort((a,b)=>timeToMinutes(a.start_time)-timeToMinutes(b.start_time)); const free=[]; let last=timeToMinutes('08:00 AM'); for(const s of schedule){ const ss=timeToMinutes(s.start_time); if(ss>last) free.push(`${formatTime(last)} - ${s.start_time}`); last=Math.max(last,timeToMinutes(s.end_time)); } if(last<timeToMinutes('10:00 PM')) free.push(`${formatTime(last)} - 10:00 PM`); return free; }
    function formatTime(minutes){ let h=Math.floor(minutes/60), m=minutes%60, period=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m)+' '+period; }

    function sortRooms(list){ const s=document.getElementById('sortBy').value; if(s==='capacity_desc') return list.sort((a,b)=>(b.capacity||0)-(a.capacity||0)); if(s==='capacity_asc') return list.sort((a,b)=>(a.capacity||0)-(b.capacity||0)); if(s==='building') return list.sort((a,b)=>(a.building||'').localeCompare(b.building||'')); if(s==='available'){ const now=new Date(); const day=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()]; const t=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}); return list.sort((a,b)=> (isRoomFreeAtTime(b,day,t,t)?1:0) - (isRoomFreeAtTime(a,day,t,t)?1:0)); } return list; }

    function renderResults(){ const minCap=parseInt(document.getElementById('capacityFilter').value)||0; const maxCap=parseInt(document.getElementById('maxCapacityFilter').value)||Infinity; const q=document.getElementById('roomSearch').value.toLowerCase(); const start=document.getElementById('startTime').value; const end=document.getElementById('endTime').value;
        let filtered=classroomsData.filter(r=>{ if(selectedBuildings.size>0 && !selectedBuildings.has(r.building)) return false; if(minCap && (!r.capacity || r.capacity<minCap)) return false; if(maxCap!==Infinity && r.capacity && r.capacity>maxCap) return false; if(q && !((r.text||'').toLowerCase().includes(q) || (r.building||'').toLowerCase().includes(q))) return false; if(selectedCharacteristics.size>0){ if(!r.characteristics) return false; for(const c of selectedCharacteristics) if(!r.characteristics.includes(c)) return false; } if(start&&end){ if(selectedDay){ if(!isRoomFreeAtTime(r,selectedDay,start,end)) return false; } else{ const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; if(!days.some(d=>isRoomFreeAtTime(r,d,start,end))) return false; } } return true; });
        filtered=sortRooms(filtered);
        document.getElementById('totalRooms').textContent=filtered.length; const now=new Date(), dayName=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()], nowStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}); document.getElementById('availableRooms').textContent=filtered.filter(r=>isRoomFreeAtTime(r,dayName,nowStr,nowStr)).length;
        const wrap=document.getElementById('results'); if(filtered.length===0){ wrap.innerHTML=`<div class="no-results"><h3>No rooms found</h3><p>Adjust filters to see results.</p></div>`; return }
        wrap.innerHTML=filtered.map(r=>{
            const chars=r.characteristics? r.characteristics.map(c=>`<span class="char-tag">${c}</span>`).join('') : '';
            let imgHtml = '';
            if (r.image_url) {
                // Image with loading states; fails silently due to CORS restrictions
                imgHtml = `<div class="room-image"><img src="${r.image_url}" alt="${r.text}" loading="lazy" decoding="async" class="loading" onload="this.classList.remove('loading')" onerror="this.closest('.room-image').parentElement.classList.add('no-image');this.closest('.room-image').style.display='none'"></div>`;
            }
            const scheduleHtml = buildCalendarGrid(r);

            return `
                <div class="room-card ${r.image_url ? '' : 'no-image'}">
                    ${imgHtml}
                    <div class="room-body">
                        <h3 class="room-title">${r.text}</h3>
                        <div class="room-info"><span class="badge">${r.building||''}</span>${r.capacity?`<span class="badge">Cap ${r.capacity}</span>`:''}${r.type?`<span class="badge">${r.type}</span>`:''}</div>
                        <div style="margin-top:8px"><button class="btn btn-details" onclick="toggleDetails(this)">Details ▾</button></div>
                        <div class="details">
                            <div class="char-tags">${chars}</div>
                            <div class="schedule">${scheduleHtml}</div>
                            <div style="margin-top:12px;text-align:right"><a href="${r.url||'#'}" target="_blank">UCLA Schedule →</a></div>
                        </div>
                    </div>
                </div>
            `;
        }).join(''); }

    function setDefaultTimesAndDay(){ const s=document.getElementById('startTime'), e=document.getElementById('endTime'); if(!s||!e) return; const now=new Date(); let h=now.getHours(); if(h<8)h=8; if(h>22)h=22; const fmt=h=>{ const p=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return (hh<10?'0'+hh:hh)+':00 '+p }; s.value=[...s.options].some(o=>o.value===fmt(h))?fmt(h):''; e.value=[...e.options].some(o=>o.value===fmt(Math.min(h+2,22)))?fmt(Math.min(h+2,22)):''; const today=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()]; const btn=document.querySelector(`.day-btn[data-day="${today}"]`); if(btn){ document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); selectedDay=today } document.getElementById('sortBy').value='available'; }

    function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms) } }
    </script>
